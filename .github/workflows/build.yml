name: Build TCL Render Probe (ARM32)
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/main.cpp'
      - '.github/workflows/build.yml'
      - 'tools/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enforce offline LDM158 safety gate
        run: python3 -m unittest discover -s tests -v
      - name: Setup Android SDK (without deprecated tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install pinned Android NDK
        run: sdkmanager --install 'ndk;27.2.12479018'
      - name: Build whitelisted Binder probe
        shell: bash
        run: |
          set -euo pipefail
          TOOL="${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi34-clang++"
          test -x "$TOOL" || { echo "ERROR: Android NDK compiler missing: $TOOL"; exit 1; }
          mkdir -p out
          "$TOOL" src/main.cpp -std=c++17 -O2 -fPIE -pie -fstack-protector-strong \
            -Wall -Wextra -Werror -Wl,-z,relro,-z,now \
            -lbinder_ndk -ldl -o out/tcl_render_probe
          file out/tcl_render_probe
          sha256sum out/tcl_render_probe | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TCL-Render-Probe-ARM32
          path: out/
          if-no-files-found: error
